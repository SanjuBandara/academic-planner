spring.application.name=academic-planner

# ----------------------------------------------------------------------------
# Database (PostgreSQL running via Docker)
# Values are read from environment variables where possible; sensible local
# defaults are provided as fallbacks so `mvn spring-boot:run` works out of the
# box in development. DO NOT put real production credentials here.
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academic_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# Session-based authentication
# ----------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ----------------------------------------------------------------------------
# CORS - configurable allowed origin(s) for the React frontend
# ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8000}

server.port=${SERVER_PORT:8080}

# ----------------------------------------------------------------------------
# Jackson JSON serialization
# Serialize LocalDate, LocalTime, LocalDateTime as ISO-8601 strings
# ----------------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# ----------------------------------------------------------------------------
# Python CP-SAT Planning Microservice
# PLANNING_SERVICE_URL  – set this env var in Docker / prod (e.g. http://planning-service:8000)
# Falls back to http://localhost:8000 for local development.
# ----------------------------------------------------------------------------
planning.python-service.base-url=${PLANNING_SERVICE_URL:http://127.0.0.1:8000}
planning.python-service.connect-timeout-ms=${PLANNING_CONNECT_TIMEOUT_MS:2000}
planning.python-service.read-timeout-ms=${PLANNING_READ_TIMEOUT_MS:30000}

# ----------------------------------------------------------------------------
# AI Planning Assistant
# Pluggable LLM configuration (OpenAI, OpenRouter, Ollama, etc.)
# ----------------------------------------------------------------------------
ai.enabled=${AI_ENABLED:true}
ai.provider=${AI_PROVIDER:openai}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.api-key=${OPENAI_API_KEY:}
ai.base-url=${AI_BASE_URL:https://api.openai.com/v1}
ai.timeout-ms=${AI_TIMEOUT_MS:25000}

