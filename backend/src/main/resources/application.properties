spring.application.name=academic-planner

# ----------------------------------------------------------------------------
# Database (PostgreSQL running via Docker)
# Values are read from environment variables where possible; sensible local
# defaults are provided as fallbacks so `mvn spring-boot:run` works out of the
# box in development. DO NOT put real production credentials here.
# ----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/academic_planner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ----------------------------------------------------------------------------
# Session-based authentication
# ----------------------------------------------------------------------------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# ----------------------------------------------------------------------------
# CORS - configurable allowed origin(s) for the React frontend
# ----------------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8000}

server.port=${SERVER_PORT:8080}
